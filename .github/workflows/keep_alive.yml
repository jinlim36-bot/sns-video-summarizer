name: Keep Streamlit Alive

on:
  schedule:
    # Every two hours, staggered away from the busy start of the hour (UTC).
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-keep-alive
  cancel-in-progress: false

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://sns-video-summarizer-hukphapjbrrte5n87fyat9.streamlit.app' }}
      STREAMLIT_APP_TITLE: '🎬 SNS 영상 AI 요약기'
    steps:
      - uses: actions/checkout@v4
      - name: Check app URL configuration
        run: |
          if [ -z "$STREAMLIT_APP_URL" ]; then
            echo '::error::Set the STREAMLIT_APP_URL repository Actions variable to the deployed SNS app URL.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Visit, wake, and verify app
        run: python scripts/keep_streamlit_alive.py
